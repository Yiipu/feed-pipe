# build-feeds.yml — build feeds on GitHub and deploy out/ to GitHub Pages.
# Feed URLs: https://<user>.github.io/feed-pipe/<name>.xml
#
# Without the OPENAI_BASE_URL/OPENAI_API_KEY repo secrets the build runs in
# offline mock mode (shared-lib mock, no network); set both secrets to a
# publicly reachable OpenAI-compatible gateway for real translation.
#
# Schedule: every 2 hours (~1 min/run ≈ 370 min/month) — stays well inside
# the 2000 min/month free-tier budget; a 30-min cron would exceed it.
name: build feeds

on:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Translation/summary cache; unchanged items cost nothing across runs.
      # Unique save key (run_id) + restore-keys prefix: an exact primary-key
      # hit makes actions/cache skip saving, so hashing feeds.conf here would
      # pin a stale cache forever and re-call the LLM for every new item.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rssmw
          # v2: mock run (pre-secrets) polluted the cache with [MOCK] titles;
          # bump the suffix to discard cache generations written by mock builds.
          key: rssmw-v2-${{ github.run_id }}
          restore-keys: rssmw-v2-

      - name: Build feeds
        run: |
          uv sync --frozen
          scripts/build_feeds.sh
        # Repo secrets are not auto-injected; both must be declared here or the
        # build silently falls back to offline mock mode.
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate XML output
        run: |
          uv run python - <<'EOF'
          from pathlib import Path
          from lxml import etree
          files = sorted(Path("out").glob("*.xml"))
          assert files, "no feeds built"
          for f in files:
              etree.parse(str(f))
          print("valid:", ", ".join(f.name for f in files))
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
